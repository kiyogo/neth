<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="260" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Ambient glowing spots -->
  <circle cx="160" cy="130" r="100" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="850" cy="80" r="120" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>

  <!-- Isometric Logo Mark on Left (Center: 140, 130) -->
  <g transform="translate(40, 30)">
    <!-- Top Face -->
    <polygon points="100,26 160,61 100,96 40,61" fill="url(#topFace)" opacity="0.9"/>
    <!-- Left Face -->
    <polygon points="40,61 100,96 100,174 40,139" fill="url(#leftFace)" opacity="0.95"/>
    <!-- Right Face -->
    <polygon points="100,96 160,61 160,139 100,174" fill="url(#rightFace)" opacity="0.95"/>

    <!-- N Column Left -->
    <polygon points="56,72 72,81 72,151 56,142" fill="#38bdf8" opacity="0.95"/>
    <polygon points="56,72 64,68 80,77 72,81" fill="#7dd3fc" opacity="0.9"/>

    <!-- N Column Right -->
    <polygon points="128,81 144,72 144,142 128,151" fill="#f43f5e" opacity="0.95"/>
    <polygon points="128,81 136,77 152,86 144,90" fill="#fb7185" opacity="0.9"/>

    <!-- N Diagonal -->
    <polygon points="72,81 88,90 128,151 112,142" fill="url(#accent)"/>

    <!-- Core Dot -->
    <circle cx="100" cy="112" r="3" fill="#ffffff" filter="url(#glow)"/>

    <!-- Wireframe -->
    <polyline points="100,26 160,61 160,139 100,174 40,139 40,61 100,26" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
    <line x1="100" y1="96" x2="100" y2="174" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
    <line x1="100" y1="96" x2="40" y2="61" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
    <line x1="100" y1="96" x2="160" y2="61" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Text Header Section -->
  <g transform="translate(250, 0)">
    <!-- Supertitle / Organization -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="3">KIYOVN OPEN-SOURCE ENGINE</text>

    <!-- Main Title "NETH" -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#primary)" letter-spacing="4">NETH</text>

    <!-- Subtitle -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">High-Performance Minecraft Server Engine in Rust</text>

    <!-- Badges / Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Java Edition 26.3 -->
      <rect x="0" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Java Edition 26.3</text>

      <!-- Pill 2: Bedrock Protocol 2193 -->
      <rect x="155" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="232" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Bedrock NetherNet</text>

      <!-- Pill 3: Rust Edition 2024 -->
      <rect x="320" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="387" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">Rust 2024 Async</text>

      <!-- Pill 4: 90% Milestone -->
      <rect x="465" y="0" width="165" height="28" rx="6" fill="#132e27" stroke="#059669" stroke-width="1"/>
      <text x="547" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">90% Parity Milestone</text>
    </g>
  </g>
</svg>
