[package]
name = "neth"
version.workspace = true
authors.workspace = true
description = "High-performance Minecraft Java Edition server in Rust."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage = "https://kiyomc.com"
repository = "https://kiyomc.com"

[package.metadata.tauri-winres]
# FileDescription is handled as the Program name by Windows!
FileDescription = "Neth"
OriginalFilename = "neth.exe"
LegalCopyright = "Copyright © 2026 KIYOVN. Portions Copyright © 2024-2026 Aleksander Medvedev and Pumpkin contributors."

[[bin]]
name = "neth"
path = "src/main.rs"

[dependencies]
pumpkin-core.workspace = true
pumpkin-wasm-host.workspace = true
pumpkin-config.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-util.workspace = true
pumpkin-world.workspace = true

rayon.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
console-subscriber = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[target.'cfg(all(any(target_os = "windows", target_os = "macos", all(target_os = "linux", target_env = "gnu")), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
pumpkin-profiler = { workspace = true, optional = true }

[features]
profiler = ["memory-profiler"]
memory-profiler = ["dep:pumpkin-profiler", "pumpkin-core/memory-profiler"]
console-subscriber = ["dep:console-subscriber"]
# Load plugins built against the v0.2 API. Off until the v0.2 ABI is finished.
plugin-v0_2 = ["pumpkin-wasm-host/v0_2"]

[dev-dependencies]
pumpkin-wasm-host-common.workspace = true

[lints]
workspace = true

