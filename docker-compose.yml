services:
  neth:
    build: .
    ports:
      - "25565:25565"
      - "19132:19132/udp"
    volumes:
      # Neth runs as UID/GID 2613. On Linux hosts, make sure the data
      # directory has the correct ownership before starting the server:
      #   mkdir -p ./data
      #   sudo chown -R 2613:2613 ./data
      - ./data:/neth
      # As an alternative, Docker can manage the storage volume:
      # - neth-data:/neth
      # - ./neth.toml:/neth/neth.toml:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    read_only: true
