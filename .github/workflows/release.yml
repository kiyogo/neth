name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag name (optional, defaults to Cargo.toml version)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build_release:
    name: Build Release Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            output_name: neth-linux-x86_64
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
            output_name: neth-linux-x86_64-musl
            use_musl: true
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            output_name: neth-windows-x86_64.exe
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            output_name: neth-macos-arm64
          - os: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
            output_name: neth-macos-x86_64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install musl-tools (Linux musl)
        if: matrix.use_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release Binary
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin neth
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/neth"
          if [ "${{ runner.os }}" == "Windows" ]; then
            BIN_PATH="${BIN_PATH}.exe"
          fi
          cp "${BIN_PATH}" "dist/${{ matrix.output_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 14

  publish_release:
    name: Publish GitHub Release
    needs: [build_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
            TAG="v${VERSION}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Determined release tag: ${TAG}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum neth-* > checksums.sha256
          echo "Generated Checksums:"
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Neth Server ${{ steps.tag.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/neth-*
            dist/checksums.sha256
          generate_release_notes: true
          body: |
            Neth Server Release ${{ steps.tag.outputs.tag_name }}
            High-Performance Minecraft Server Engine in Rust
            Official Website: https://kiyomc.com
